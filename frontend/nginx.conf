server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same rule as the Vite dev proxy: /api/campaigns -> backend /campaigns.
    # The trailing slash after 8000 is what removes the /api prefix.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generating variants waits for the language model.
        proxy_read_timeout 120s;
    }

    # React Router: unknown paths load the app.
    location / {
        try_files $uri /index.html;
    }
}
